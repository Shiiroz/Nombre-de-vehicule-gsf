<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="GSF Équipe Nuit – 226 véhicules">
<title>GSF Équipe Nuit – 226 véhicules</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    overflow:hidden;
    background:#021a14;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== FOND ANIMÉ ===== */
  .bg-base{
    position:fixed; inset:0;
    background: radial-gradient(ellipse 90% 70% at 50% 35%, #0c7a5c 0%, #043d30 50%, #021a14 100%);
  }

  /* Orbes lumineux qui flottent */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.35;
    pointer-events:none;
    z-index:1;
  }
  .orb1{
    width:55vw; height:55vw;
    max-width:520px; max-height:520px;
    background:#0f8a6a;
    top:-10%; left:-10%;
    animation: float1 18s ease-in-out infinite alternate;
  }
  .orb2{
    width:45vw; height:45vw;
    max-width:420px; max-height:420px;
    background:#147a5f;
    bottom:-15%; right:-10%;
    animation: float2 22s ease-in-out infinite alternate;
  }
  .orb3{
    width:30vw; height:30vw;
    max-width:280px; max-height:280px;
    background:#1a9b78;
    top:40%; left:60%;
    opacity:0.22;
    animation: float3 15s ease-in-out infinite alternate;
  }

  @keyframes float1{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(8%,12%) scale(1.12);}
  }
  @keyframes float2{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(-10%,-8%) scale(1.15);}
  }
  @keyframes float3{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(-15%,10%) scale(1.2);}
  }

  /* Légères particules de lumière */
  .sparkle{
    position:fixed;
    width:4px; height:4px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    z-index:1;
    box-shadow:0 0 8px 2px rgba(255,255,255,0.4);
  }

  /* Texte de fond */
  #bg-text{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:clamp(48px, 18vw, 160px);
    font-weight:900;
    line-height:0.95;
    letter-spacing:0.02em;
    color:rgba(255,255,255,0.055);
    transform:rotate(-11deg);
    white-space:pre-line;
    user-select:none;
    pointer-events:none;
    z-index:2;
  }

  canvas{position:fixed; inset:0; z-index:3;}

  .wrap{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    z-index:4;
    pointer-events:none;
  }

  #big{
    font-size:clamp(90px, 28vw, 220px);
    font-weight:900;
    line-height:1;
    color:#ffd84d;
    text-shadow:
      0 0 40px rgba(255,154,61,0.7),
      0 0 80px rgba(255,154,61,0.35),
      0 12px 0 #b24a00;
    transform:scale(0.3);
    opacity:0;
  }

  #big.visible{
    animation: popIn 1.1s cubic-bezier(0.16, 1.2, 0.3, 1) forwards;
  }

  #sub{
    margin-top:1.2vh;
    font-size:clamp(18px, 4.5vw, 32px);
    font-weight:500;
    letter-spacing:0.04em;
    opacity:0;
    transform:translateY(18px);
  }

  #sub.visible{
    animation: fadeUp 0.9s ease 0.9s forwards;
  }

  #badge{
    margin-top:3.5vh;
    padding:8px 20px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    font-size:clamp(12px, 2.8vw, 15px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(12px);
  }

  #badge.visible{
    animation: fadeUp 0.8s ease 1.3s forwards;
  }

  #hint{
    position:fixed;
    bottom:18px;
    width:100%;
    text-align:center;
    font-size:13px;
    opacity:0.35;
    letter-spacing:0.03em;
    z-index:5;
  }

  @keyframes popIn{
    0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.08) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }

  @keyframes fadeUp{
    to{opacity:1; transform:translateY(0);}
  }

  #big.pulse{
    animation: softPulse 2.4s ease-in-out infinite;
  }
  @keyframes softPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.03);}
  }
</style>
</head>
<body>
  <div class="bg-base"></div>

  <!-- Orbes de fond animés -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div id="bg-text">GSF
ÉQUIPE NUIT</div>
  <canvas id="c"></canvas>

  <div class="wrap">
    <div id="big">0</div>
    <div id="sub">Nombre de véhicules</div>
    <div id="badge">Équipe de nuit</div>
  </div>

  <div id="hint">Clique n’importe où pour relancer les confettis</div>

<script>
// ===================== CONFIG =====================
const TARGET = 226;
const MESSAGE = "Nombre de véhicules";
// ==================================================

const big = document.getElementById("big");
const sub = document.getElementById("sub");
const badge = document.getElementById("badge");
sub.textContent = MESSAGE;

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W, H, particles = [];

function resize(){
  W = c.width = innerWidth;
  H = c.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// ---------- Petites lumières qui scintillent ----------
function createSparkles(){
  for(let i=0; i<18; i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    document.body.appendChild(s);

    const delay = Math.random()*8;
    const duration = 3 + Math.random()*4;

    s.animate([
      {opacity:0, transform:"scale(0.3)"},
      {opacity:0.7, transform:"scale(1)", offset:0.3},
      {opacity:0, transform:"scale(0.3)"}
    ], {
      duration: duration*1000,
      delay: delay*1000,
      iterations: Infinity,
      easing: "ease-in-out"
    });
  }
}
createSparkles();

// ---------- Confettis ----------
const COLORS = [
  "#ff4fa3","#ffd84d","#4dd2ff","#7dff6b",
  "#ff8a3d","#c28bff","#ff6b6b","#54e0c2"
];

function createParticle(x, y, burst = false){
  const angle = Math.random() * Math.PI * 2;
  const speed = burst ? (8 + Math.random() * 14) : (2 + Math.random() * 4);
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - (burst ? 9 : 2),
    w: 5 + Math.random() * 9,
    h: 8 + Math.random() * 12,
    r: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.35,
    color: COLORS[(Math.random() * COLORS.length) | 0],
    shape: Math.random() > 0.45 ? "rect" : "circle",
    life: 1,
    decay: 0.005 + Math.random() * 0.008
  };
}

function burst(n = 180){
  const cx = W / 2, cy = H / 2 - 40;
  for(let i = 0; i < n; i++){
    particles.push(createParticle(cx, cy, true));
  }
}

function rain(){
  for(let i = 0; i < 5; i++){
    particles.push(createParticle(Math.random() * W, -30, false));
  }
}

function drawParticle(p){
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.r);
  ctx.globalAlpha = Math.max(0, p.life);
  ctx.fillStyle = p.color;

  if(p.shape === "circle"){
    ctx.beginPath();
    ctx.arc(0, 0, p.w * 0.55, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0, 0, W, H);

  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += 0.22;
    p.vx *= 0.992;
    p.x += p.vx;
    p.y += p.vy;
    p.r += p.vr;
    p.life -= p.decay;

    drawParticle(p);

    if(p.y > H + 40 || p.life <= 0){
      particles.splice(i, 1);
    }
  }
  requestAnimationFrame(loop);
}
loop();

// ---------- Compteur ----------
function animateCount(from, to, duration){
  const start = performance.now();
  function update(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const value = Math.round(from + (to - from) * eased);
    big.textContent = value;
    if(t < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// ---------- Lancement ----------
setTimeout(() => {
  big.classList.add("visible");
  sub.classList.add("visible");
  badge.classList.add("visible");

  setTimeout(() => animateCount(0, TARGET, 2200), 350);

  setTimeout(() => burst(220), 400);
  setTimeout(() => burst(160), 1100);

  const rainInterval = setInterval(rain, 140);
  setTimeout(() => clearInterval(rainInterval), 5500);

  setTimeout(() => big.classList.add("pulse"), 2800);
}, 200);

document.addEventListener("click", () => {
  burst(200);
});
</script>
</body>
</html>
