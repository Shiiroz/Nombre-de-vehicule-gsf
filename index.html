<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nombre de véhicules</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at center,#0f8a6a,#03231c);font-family:Arial,Helvetica,sans-serif;color:#fff}
  canvas{position:fixed;inset:0}
  #bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:min(22vw,20vh);font-weight:900;line-height:1;letter-spacing:.04em;color:rgba(255,255,255,.12);transform:rotate(-12deg);white-space:pre-line;user-select:none}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #big{font-size:min(38vw,38vh);font-weight:900;line-height:1;color:#ffd84d;text-shadow:0 0 30px #ff9a3d,0 8px 0 #b24a00;transform:scale(0);animation:pop 1s cubic-bezier(.2,1.6,.4,1) .3s forwards,pulse 1.6s ease-in-out 1.4s infinite}
  #sub{font-size:min(7vw,5vh);margin-top:2vh;opacity:0;animation:fade 1s ease 1.2s forwards}
  #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:14px;opacity:.5}
  @keyframes pop{to{transform:scale(1) rotate(-3deg)}}
  @keyframes pulse{50%{transform:scale(1.07) rotate(3deg)}}
  @keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<div id="bg">GSF
ÉQUIPE NUIT</div>
<canvas id="c"></canvas>
<div class="wrap">
  <div id="big">226</div>
  <div id="sub">Nombre de véhicules</div>
<div style="font-size:16vw;margin-top:2vh">🖕</div>
</div>
<div id="hint">Clique pour relancer les confettis</div>
<script>
// ✏️ Modifie ces deux lignes pour changer le texte :
var NUMBER = "226";
var MESSAGE = "Nombre de véhicules";
document.getElementById("big").textContent = NUMBER;
document.getElementById("sub").textContent = MESSAGE;

var c = document.getElementById("c"), x = c.getContext("2d"), P = [];
function size(){c.width = innerWidth; c.height = innerHeight}
size(); addEventListener("resize", size);
var colors = ["#ff4fa3","#ffd84d","#4dd2ff","#7dff6b","#ff8a3d","#c28bff"];
function burst(n){
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, s = 6+Math.random()*12;
    P.push({x:c.width/2,y:c.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,
      w:6+Math.random()*8,h:10+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      col:colors[(Math.random()*colors.length)|0]});
  }
}
function rain(){
  for(var i=0;i<6;i++) P.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
    w:6+Math.random()*6,h:10+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,
    col:colors[(Math.random()*colors.length)|0]});
}
function loop(){
  x.clearRect(0,0,c.width,c.height);
  P.forEach(function(p){
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.col;
    x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
  });
  P = P.filter(function(p){return p.y < c.height+30});
  requestAnimationFrame(loop);
}
loop();
setTimeout(function(){burst(250)},300);
setTimeout(function(){burst(200)},1200);
var t = setInterval(rain,120); setTimeout(function(){clearInterval(t)},6000);
document.addEventListener("click",function(){burst(250)});
</script>
</body>
</html>
